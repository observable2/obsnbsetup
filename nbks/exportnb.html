<!doctype html>
<notebook theme="air">
  <title>Save an OnlineObservable notebook locallyand convert its format</title>
  <script id="1" type="text/markdown">
    # Save an Online<br>Observable notebook locally<br>and convert its format

    This [Converter](exportnb.html) page provides an alternative way to export an online notebook. (If you are using it for your first file then **`Save As...`** **`index.html`** inside your **`nbks`** folder.)

    **NOTE:** This page is based, in part, on the work of James King who produced a method of doing the same thing using a bookmarklet: [James King’s Download Notebook Bookmarklet](https://tools.jamesking.io/observable-notebook-export/).

    1. In a brower window, open the notebook on observablehq.com and let it finish loading.
    2. Save the page:&nbsp; **File → Save Page As…** (Cmd/Ctrl + S), format **Web Page, HTML Only**. (Alternatively, use *View Source*, select all, and copy.)
    3. Then either drag & drop the saved file below, or paste the copied source into the box below that.
    4. Using the button or link that appears at the end of this page, download the converted notebook and save it in one of your project’s `nbks` folders.

    Only the newer Notebooks 2.0 are supported, not classic notebooks.
  </script>
  <script id="2" type="module">
    import {exportFromPageHtml} from "./obs-export.mjs";

    const drop = html`<label style="display:block;padding:1.5rem;border:2px dashed #888;border-radius:8px;text-align:center;cursor:pointer">
      Drop the saved page here, or click to choose a file
      <input type="file" accept=".html,.htm,text/html" style="display:none">
    </label>`;
    const paste = html`<textarea rows="4" style="width:100%;margin-top:.75rem;font:12px monospace" placeholder="…or paste the page source here"></textarea>`;
    const result = html`<div style="margin-top:.75rem"></div>`;
    const input = drop.querySelector("input");

    function convert(text) {
      result.replaceChildren();
      try {
        const {html: out, title, cellCount, filename} = exportFromPageHtml(text);
        result.append(html`<p>${title || filename}: ${cellCount} cells, ${(out.length / 1024).toFixed(1)} KB.</p>`);
        if (window.showSaveFilePicker) {
          // Chrome/Edge: let the user choose where to save.
          const button = html`<button><b>Save as…</b></button>`;
          const status = html`<span style="margin-left:.5rem"></span>`;
          button.onclick = async () => {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: filename,
                types: [{description: "Observable notebook", accept: {"text/html": [".html"]}}]
              });
              const writable = await handle.createWritable();
              await writable.write(out);
              await writable.close();
              status.textContent = `Saved ${handle.name}`;
            } catch (err) {
              if (err.name !== "AbortError") status.textContent = `Couldn't save: ${err.message}`;
            }
          };
          result.append(button, status);
        } else {
          // Firefox/Safari: ordinary download (location depends on browser settings).
          const url = URL.createObjectURL(new Blob([out], {type: "text/html"}));
          result.append(html`<a href="${url}" download="${filename}"><b>Download ${filename}</b></a>`);
        }
      } catch (err) {
        result.append(html`<p style="color:#b00"><b>Couldn't convert:</b> ${err.message}</p>`);
      }
    }

    const readFile = (file) => file && file.text().then(convert);
    input.onchange = () => readFile(input.files[0]);
    drop.ondragover = (e) => e.preventDefault();
    drop.ondrop = (e) => { e.preventDefault(); readFile(e.dataTransfer.files[0]); };
    paste.oninput = () => paste.value.trim() && convert(paste.value);

    display(html`<div>${drop}${paste}${result}</div>`);
  </script>
</notebook>
