  <script id="340" type="text/markdown" output="drafted">
     ---
     ### Naming Conventions
    - ‘Name’ here refers, in practice, to a regular URL suffix that will be correctly interpreted by the Observable platform. Thus: `https://observablehq.com/@shadoof/<Name>` will direct a browser to the notebook in question.
    - All notebook names within the project begin with `inapm`.
    - The first single-digit number after this prefix indicates one of – currently – three ‘collections’ for the project. (The term ‘collection’ is used as a approximate synonym of ‘division’ so as to correspond with the ‘collection’ organizational affordance of the Observable platform.)
    - This is followed by an all lowercase abbreviated notebook name separated by an underscore.
    - If a chapter requires sub-notebooks, these will be enumerated by a double-digit number separated by ‘_s’.
    - A notebook name that is **not** followed by ‘ƒ’ (or another letter) should be taken to indicate a chapter or section of the project with, primarily, narrative or expository content.
    - A name that has (usually) ‘ƒ’ as a suffix indicates a notebook the content of which is actively demonstrative of a <em>particular</em> work of digital language art which has been included in the project. This suffix convention is adopted to associate particular works with particular narrative or expository chapters of the project in a regular fashion. The text in these sections will offer commentary that will usually be associated with live code examples within these notebooks themselves.
    - As and when necessary – e.g. for print publication or for suggested reading orders – linear sequences will be provided by tables (likely in this notebook itself) and/or algorithms operating on the name space entries. This will allow the author to compose notebooks and chapters without regard, initially, to any future or peferred sequential ordering.
  </script>
